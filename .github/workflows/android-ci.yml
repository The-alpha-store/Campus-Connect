# Builds the app on every push and pull request, and attaches the debug APK.
name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # least privilege: this workflow only needs to read the code

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Refuses to run if someone swapped the Gradle wrapper for a tampered one
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          # These come from GitHub: Settings > Secrets and variables > Actions.
          # Pull requests from forks do not receive secrets; the build then shows the
          # "not configured" screen but still compiles, which is what we want to check.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: campusconnect-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
