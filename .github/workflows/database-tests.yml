name: Supabase database tests
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase
        run: supabase start -x realtime,studio,imgproxy,edge-runtime,logflare,vector,mailpit,postgres-meta,supavisor
      - name: Apply migration and seed
        run: supabase db reset
      - name: Check migration re-runs cleanly
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          for file in supabase/migrations/*.sql; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Run RLS tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
